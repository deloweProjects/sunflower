<title>Sunflower</title>

<meta name="theme-color" content="#fff6df" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0a12" media="(prefers-color-scheme: dark)">

<style>
:root{color-scheme:light dark;
  --bg:#fff6df;--bg2:#ffe9b8;--ink:#2b1a08;--soft:#7a5f3a;--card:rgba(255,255,255,.62);--line:rgba(120,80,10,.16);
  --glow1:rgba(255,196,0,.55);--glow2:rgba(255,92,138,.32);--glow3:rgba(255,138,40,.40);--letters:.20;--shadow:0 20px 50px -22px rgba(150,90,0,.45)}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e0a12;--bg2:#1a1020;--ink:#fff6e0;--soft:#c8b8a6;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.13);
  --glow1:rgba(255,190,0,.36);--glow2:rgba(255,61,129,.30);--glow3:rgba(124,92,255,.28);--letters:.14;--shadow:0 24px 60px -24px #000}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100svh}
.serif{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-style:italic}

/* ambient colour */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,var(--bg),var(--bg2))}
.blob{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform;opacity:0;animation:fade 2.4s .1s forwards}
.b1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(closest-side,var(--glow1),transparent);animation:fade 2.4s .1s forwards,drift1 22s ease-in-out infinite alternate}
.b2{width:40vmax;height:40vmax;right:-12vmax;top:18vh;background:radial-gradient(closest-side,var(--glow2),transparent);animation:fade 2.4s .4s forwards,drift2 26s ease-in-out infinite alternate}
.b3{width:44vmax;height:44vmax;left:18vw;bottom:-22vmax;background:radial-gradient(closest-side,var(--glow3),transparent);animation:fade 2.4s .7s forwards,drift1 30s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(6vmax,4vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-7vmax,-3vmax) scale(.92)}}
@keyframes fade{to{opacity:1}}

/* the big background word */
.word{position:fixed;inset:0;z-index:1;display:grid;place-items:center;pointer-events:none;user-select:none}
.word p{font-size:min(18.5vw,52vh);line-height:.9;font-weight:800;letter-spacing:-.04em;white-space:nowrap;opacity:var(--letters);transform:translateY(-2vh)}
.word span{display:inline-block;padding:0 .02em;background-image:linear-gradient(95deg,#ffc400 0%,#ff7a1a 48%,#ff3d81 100%);background-size:900% 100%;background-position:calc(var(--i)*12.5%) 0;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:translateY(40px);filter:blur(14px);animation:letter 1.5s calc(.15s + var(--i)*.09s) cubic-bezier(.2,.7,.2,1) forwards}
@keyframes letter{to{opacity:1;transform:none;filter:none}}

/* foreground */
main{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(20px,5vh,44px) 22px clamp(22px,5vh,40px);text-align:center}
.top{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.2vh,22px);margin-top:clamp(0px,4vh,40px)}
.sun{width:clamp(130px,26vmin,230px);height:auto;filter:drop-shadow(0 18px 30px rgba(255,150,0,.35));opacity:0;transform:scale(.6) rotate(-40deg);animation:bloom 1.8s .2s cubic-bezier(.2,.8,.2,1) forwards}
.ring.b{animation:spin 70s linear infinite;transform-origin:0 0}
.ring.f{animation:spin 90s linear infinite reverse;transform-origin:0 0}
.seeds{animation:spin 160s linear infinite;transform-origin:0 0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bloom{to{opacity:1;transform:none}}
h1{font-size:clamp(30px,5.6vw,54px);line-height:1.05;font-weight:600;letter-spacing:-.02em}
h1 b{font-weight:800;background:linear-gradient(95deg,#ffb400,#ff6a2a 55%,#ff3d81);-webkit-background-clip:text;background-clip:text;color:transparent}

.mid{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.label{font-size:clamp(20px,3vw,26px);color:var(--soft)}
.card{display:flex;align-items:center;gap:16px;width:min(100%,380px);padding:14px 18px 14px 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow);color:inherit;text-decoration:none;text-align:left;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,200,60,.28),transparent 70%);transform:translateX(-120%);transition:transform .8s}
.card:hover{transform:translateY(-5px) scale(1.015);border-color:rgba(255,140,40,.55)}
.card:hover:before{transform:translateX(120%)}
.card img{width:54px;height:54px;border-radius:15px;flex:none;box-shadow:0 8px 18px -6px rgba(0,0,0,.4)}
.card b{display:block;font-size:21px;letter-spacing:-.02em}
.card small{display:block;color:var(--soft);font-size:14px}
.arrow{margin-left:auto;font-size:24px;color:#ff7a1a;transition:transform .3s}
.card:hover .arrow{transform:translateX(6px)}

.mail{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:99px;text-decoration:none;font-weight:600;font-size:16px;color:#2b1a08;
  background:linear-gradient(95deg,#ffd23f,#ff9a1f 60%,#ff6a4a);box-shadow:0 12px 30px -10px rgba(255,120,20,.65);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.mail:hover{transform:translateY(-3px);box-shadow:0 18px 38px -10px rgba(255,100,40,.8)}
.mail svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* staggered fade-in */
.rise{opacity:0;transform:translateY(26px);filter:blur(8px);animation:rise 1.2s var(--d,0s) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
@media (max-width:520px){.word p{font-size:19.5vw}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}.ring,.seeds,.blob{animation:none!important}}
</style>
